name: Build Grade APK

on:
  push:
    branches: [main]
    paths: ["android/**", "web/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
        with:
          gradle-version: "8.10.2"
      - name: Bundle the web app inside the APK (offline fallback)
        run: |
          mkdir -p android/app/src/main/assets
          cp -r web/* android/app/src/main/assets/
      - name: Use your private signing key if you added one (recommended)
        env:
          KEY_B64: ${{ secrets.GRADE_KEYSTORE_B64 }}
          KEY_PASS: ${{ secrets.GRADE_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEY_B64" ] && [ -n "$KEY_PASS" ]; then
            echo "$KEY_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            { echo "ORG_GRADLE_PROJECT_storeFile=$RUNNER_TEMP/release.jks"; echo "ORG_GRADLE_PROJECT_storePass=$KEY_PASS"; } >> "$GITHUB_ENV"
            echo "Signing with your private key"
          else
            echo "::warning::Signing with the shared key in the repo. Add GRADE_KEYSTORE_B64 and GRADE_KEYSTORE_PASSWORD secrets for a private key."
          fi
      - name: Build
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          SITE="https://$OWNER.github.io/grade-app/"   # public app-only site; source code stays private
          gradle -p android assembleRelease -PsiteUrl="$SITE" -PversionCode=${{ github.run_number }}
          cp android/app/build/outputs/apk/release/app-release.apk Grade.apk
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Grade-apk
          path: Grade.apk
      - name: Remove the previous APK from the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete-asset latest Grade.apk -y --repo "${{ github.repository }}" || true
      - name: Publish as the "latest" download
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: latest
          name: Grade (latest build)
          body: "Download **Grade.apk** below and open it on your Android phone to install or update."
          make_latest: true
          files: Grade.apk
